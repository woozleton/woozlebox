name: woozle-box

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  rag-api:
    build: ./rag-api
    container_name: rag-api
    ports:
      - "${RAG_API_PORT:-8000}:8000"
    volumes:
      - ./files:/vault:rw
      - rag_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - VAULT_PATH=${VAULT_PATH:-/vault}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - LLM_MODEL=${LLM_MODEL:-qwen3:30b-a3b}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.45}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT_INTERNAL=8000
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - DB_DIR=/app/data
      - KOKORO_URL=http://kokoro:8880
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - IMAGE_GEN_URL=${IMAGE_GEN_URL:-http://image-api:8100}
      - MUSIC_GEN_URL=${MUSIC_GEN_URL:-http://music-api:8200}
      - VIDEO_GEN_URL=${VIDEO_GEN_URL:-http://video-api:8300}
    depends_on:
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    restart: unless-stopped

  image-api:
    build: ./image-api
    container_name: image-api
    ports:
      - "${IMAGE_GEN_PORT:-8100}:8100"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  music-api:
    build: ./music-api
    container_name: music-api
    ports:
      - "${MUSIC_GEN_PORT:-8200}:8200"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  video-api:
    build: ./video-api
    container_name: video-api
    ports:
      - "${VIDEO_GEN_PORT:-8300}:8300"
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  chroma_data:
  rag_data:
  ollama_data:
  hf_cache:
